<!doctype html>
<html lang="en">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>PaperForge | Free Online PDF Editor — Annotate, Edit & Export</title>
    <meta name="title" content="PaperForge | Free Online PDF Editor — Annotate, Edit & Export" />
    <meta
      name="description"
      content="PaperForge is a fast, lightweight, and 100% private browser-based PDF editor. Annotate with text, freehand drawing, highlights, shapes, and images. Reorder, rotate, and export PDFs with zero server uploads."
    />
    <meta
      name="keywords"
      content="PDF editor, online PDF editor, free PDF editor, edit PDF in browser, annotate PDF, draw on PDF, highlight PDF, insert images in PDF, rotate PDF pages, reorder PDF, privacy-first PDF editor, client-side PDF tool"

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#18181b" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PaperForge | Free Online PDF Editor" />
    <meta
      property="og:description"
      content="A fast, modern PDF editor that keeps your documents in your hands. Annotate, edit, and export PDFs entirely in your browser."
    />
    <meta property="og:site_name" content="PaperForge" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PaperForge | Free Online PDF Editor" />
    <meta
      name="twitter:description"
      content="Edit, annotate, transform, and export PDF documents securely in your browser. No files uploaded to external servers."
    />

    <!-- Structured Data (JSON-LD) for Google Rich Snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PaperForge",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript",
        "description": "Fast, privacy-focused online PDF editor. Annotate, add text, draw, highlight, insert shapes and images, manage pages, and export PDFs directly in your browser without uploading files to external servers.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Add and edit text overlays",
          "Freehand vector drawing",
          "Translucent highlighting",
          "Rectangle, circle, line, and arrow shapes",
          "Image insertion",
          "Rotate, delete, and reorder pages",
          "Add blank pages",
          "Client-side 100% private processing"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
